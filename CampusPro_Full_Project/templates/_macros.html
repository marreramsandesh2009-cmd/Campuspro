{% macro status_badge(status) %}<span class="status-pill {{ status|lower|replace(' ','-') }}">{{ status }}</span>{% endmacro %}{% macro stat_card(label,value,icon,tone,foot) %}<article class="stat-card"><div class="stat-top"><span>{{ label }}</span><i class="bi {{ icon }} {{ tone }}"></i></div><div class="stat-value">{{ value }}</div><div class="stat-foot">{{ foot }}</div></article>{% endmacro %}
